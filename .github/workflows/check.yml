name: Check render

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fails the check on undefined citations or missing figure/asset paths,
      # which `quarto render` would otherwise let through with exit 0.
      - name: Check references
        run: python scripts/check-refs.py

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        run: quarto render --to html

      # Non-blocking for now (fail: false) to avoid flaky third-party URLs;
      # flip to blocking once the baseline is clean.
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206,429 './_book/**/*.html'
          fail: false

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: book-preview
          path: _book
          retention-days: 7
