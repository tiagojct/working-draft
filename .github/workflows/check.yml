name: Check render

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Fails the check on undefined citations or missing figure/asset paths,
      # which `quarto render` would otherwise let through with exit 0.
      - name: Check references
        run: python scripts/check-refs.py

      # Fails if a chapter quotes a descriptive the committed cohort CSVs no
      # longer support — the drift that put a baseline table out of step with
      # its own dataset.
      - name: Check cohort numbers
        run: python scripts/check-numbers.py

      - uses: quarto-dev/quarto-actions/setup@v2

      # Full render, not --to html: the Typst/PDF path fails on things HTML
      # tolerates (a duplicate bib key, a missing font), and deploy.yml renders
      # both. Checking only HTML here lets those breakages through to main.
      - name: Render book
        run: quarto render

      # Non-blocking for now (fail: false) to avoid flaky third-party URLs;
      # flip to blocking once the baseline is clean.
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206,429 './_book/**/*.html'
          fail: false

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: book-preview
          path: _book
          retention-days: 7
