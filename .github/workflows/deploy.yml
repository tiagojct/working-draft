name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Same guard as check.yml: `quarto render` exits 0 on undefined citations
      # and broken paths, so without this a direct push to main publishes them.
      - name: Check references
        run: python scripts/check-refs.py

      - name: Check cohort numbers
        run: python scripts/check-numbers.py

      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render book
        run: quarto render
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
