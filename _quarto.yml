project:
  type: book
  output-dir: _book

book:
  title: "The Working Draft"
  subtitle: "Writing and Data Visualisation for Health Researchers"
  author:
    name: Tiago Jacinto
    affiliation: Faculty of Medicine, University of Porto
    orcid: 0000-0002-7897-1101
  date: "2026-05-15"
  cover-image: figures/dataviz/hero.png
  repo-url: https://github.com/tiagojct/working-draft
  repo-actions: [edit, issue]
  search: true
  open-graph:
    title: "The Working Draft"
    description: "Writing and data visualisation for health researchers."
    image: figures/dataviz/hero.png
  page-footer:
    center: |
      [Tiago Jacinto](https://tiagojct.eu) · Faculty of Medicine, University of Porto ·
      [tiagojct.eu/working-draft/](https://tiagojct.eu/working-draft/)
  chapters:
    - index.qmd
    - part: "Part I · Writing"
      chapters:
        - chapters/01-why-writing.qmd
        - chapters/02-article-structure.qmd
        - chapters/03-clear-writing.qmd
        - chapters/writing-l2.qmd
        - chapters/04-presenting-data.qmd
        - chapters/statistical-writing.qmd
        - chapters/05-editorial-process.qmd
        - chapters/06-reporting-guidelines.qmd
        - chapters/open-science.qmd
        - chapters/07-reference-management.qmd
        - chapters/08-co-authorship.qmd
        - chapters/ai-writing.qmd
        - chapters/09-workflow.qmd
    - chapters/part-ii-bridge.qmd
    - part: "Part II · Figures"
      chapters:
        - chapters/10-principles.qmd
        - chapters/11-chart-types.qmd
        - chapters/12-pitfalls.qmd
        - chapters/13-captions.qmd
        - chapters/14-colour.qmd
        - chapters/15-ai-figures.qmd
    - chapters/16-conclusion.qmd
    - chapters/guide.qmd
    - references.qmd

citation:
  url: https://tiagojct.eu/working-draft/
  type: book

bibliography: [assets/refs-sw.bib, assets/refs-dataviz.bib]
csl: assets/nature.csl

format:
  html:
    include-in-header: assets/head.html
    theme: [cosmo, assets/custom.scss]
    mainfont: "Atkinson Hyperlegible Next, Atkinson Hyperlegible, system-ui, sans-serif"
    monofont: "Geist Mono, ui-monospace, Menlo, monospace"
    reference-location: margin
    footnotes-hover: true
    fig-align: center
    toc: true
    toc-depth: 3
    number-sections: false
    grid:
      body-width: 700px
      margin-width: 260px
