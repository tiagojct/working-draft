project:
  type: book
  output-dir: _book
  # The custom domain is set in the repository's Pages settings, NOT by this
  # file: a CNAME inside the artifact only configures the domain under the
  # legacy branch-based deploy, and this repo builds Pages from a workflow.
  # Kept anyway so the domain survives a switch back to branch deploys, and as
  # the in-repo record of where the book is published.
  resources:
    - CNAME

book:
  title: "The Working Draft"
  subtitle: "Writing and Data Visualisation for Health Researchers"
  author:
    name: Tiago Jacinto
    affiliation: Faculty of Medicine, University of Porto
    orcid: 0000-0002-7897-1101
  date: "2026-08-07"
  site-url: https://workingdraft.tiagojacinto.eu/
  favicon: assets/favicon.svg
  # Without an explicit social image Quarto falls back to the first image in the
  # page, which on the landing page is its own inline link-icon data URI.
  # Regenerate with `python3 figures/social_card.py`.
  image: assets/social-card.png
  repo-url: https://github.com/tiagojct/working-draft
  repo-actions: [edit, issue]
  search: true
  downloads: [pdf]
  open-graph:
    title: "The Working Draft"
    description: "Writing and data visualisation for health researchers."
    # Absolute on purpose: Quarto resolves a relative og:image per page, which
    # gave chapters the broken /chapters/assets/social-card.png.
    image: https://workingdraft.tiagojacinto.eu/assets/social-card.png
  page-footer:
    center: |
      [Tiago Jacinto](https://tiagojacinto.eu) · Faculty of Medicine, University of Porto ·
      [workingdraft.tiagojacinto.eu](https://workingdraft.tiagojacinto.eu/)
  chapters:
    - index.qmd
    - part: "Part I · Writing"
      chapters:
        - chapters/01-why-writing.qmd
        - chapters/framing-the-question.qmd
        - chapters/02-article-structure.qmd
        - chapters/03-clear-writing.qmd
        - chapters/writing-l2.qmd
        - chapters/04-presenting-data.qmd
        - chapters/statistical-writing.qmd
        - chapters/05-editorial-process.qmd
        - chapters/06-reporting-guidelines.qmd
        - chapters/open-science.qmd
        - chapters/systematic-reviews.qmd
        - chapters/07-reference-management.qmd
        - chapters/08-co-authorship.qmd
        - chapters/ai-writing.qmd
        - chapters/09-workflow.qmd
    - chapters/part-ii-bridge.qmd
    - part: "Part II · Figures"
      chapters:
        - chapters/10-principles.qmd
        - chapters/11-chart-types.qmd
        - chapters/12-pitfalls.qmd
        - chapters/13-captions.qmd
        - chapters/14-colour.qmd
        - chapters/15-ai-figures.qmd
    - chapters/part-iii-bridge.qmd
    - part: "Part III · Reproducible research"
      chapters:
        - chapters/prediction-models.qmd
        - chapters/reproducibility.qmd
    - chapters/16-conclusion.qmd
    - chapters/worked-example.qmd
    - chapters/guide.qmd
    - chapters/glossary.qmd
    - chapters/checklists.qmd
    - references.qmd

citation:
  url: https://workingdraft.tiagojacinto.eu/
  type: book

bibliography: [assets/refs-sw.bib, assets/refs-dataviz.bib]
csl: assets/nature.csl

format:
  html:
    # Glauca theme: light (Pruina) leads, dark (Profundum) answers.
    # book.scss is the book-only layer over the vendored Glauca SCSS.
    theme:
      light:
        - assets/glauca.scss
        - assets/book.scss
      dark:
        - assets/glauca-dark.scss
        - assets/book.scss
    # Self-hosted IBM Plex (base64-inlined woff2) so fonts load on
    # GitHub Pages and file:// without path resolution issues.
    css: assets/glauca-fonts.css
    highlight-style: assets/glauca.theme
    mainfont: "IBM Plex Sans"
    monofont: "IBM Plex Mono"
    reference-location: margin
    footnotes-hover: true
    fig-align: center
    toc: true
    toc-depth: 3
    number-sections: false
    grid:
      body-width: 780px
      margin-width: 260px
  typst:
    # Downloadable PDF. Glauca brand (IBM Plex + blue headings/links)
    # injected via typst-brand.typ; static IBM Plex faces bundled under
    # fonts/glauca so the PDF is correctly set on CI too.
    include-in-header:
      - assets/glauca-typst.typ
      - assets/book-typst.typ
    # Quarto routes book+typst through the bundled orange-book extension. These
    # override two of its partials: a cover and credits page, and unnumbered
    # front matter. See the header comment in each file.
    template-partials:
      - assets/typst-partials/page.typ
      - assets/typst-partials/typst-show.typ
    font-paths:
      - fonts/glauca
    papersize: a4
    fontsize: 11pt
    # Chapters use .column-margin, so Quarto routes the Typst book through
    # marginalia and derives the page geometry itself. Its derived values are
    # wrong here: `margin.x` is read as inner.sep/outer.far, which squeezed the
    # body to 76 mm (tables overflowed, chapter titles broke mid-word). These
    # explicit overrides restore an A4 book measure: 25 mm inner, 120 mm body,
    # 45 mm outer note column. They must sum to the 210 mm page width.
    margin-geometry:
      inner:
        far: 15mm
        width: 5mm
        separation: 5mm
      outer:
        far: 15mm
        width: 45mm
        separation: 5mm
      clearance: 12pt
    margin:
      top: 2.2cm
      bottom: 2.2cm
    mainfont: "IBM Plex Sans"
    monofont: "IBM Plex Mono"
    toc: true
    toc-depth: 3
    number-sections: true
    fig-align: center
